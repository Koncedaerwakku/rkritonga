<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umpan Balik Pelanggan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between p-4 font-sans text-slate-800">

  <div class="max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-6 md:p-8 space-y-6 border border-slate-100 text-center">
    
    <!-- Header / Logo -->
    <div class="space-y-2">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
        <i class="fa-solid fa-store"></i>
      </div>
      <h1 id="shopNameDisplay" class="text-xl font-bold text-slate-900">Selamat Datang!</h1>
      <p class="text-xs text-slate-500">Kepuasan Anda sangat berharga bagi kami. Silakan beri penilaian layanan kami:</p>
    </div>

    <!-- Rating Bintang -->
    <div class="py-4">
      <div class="flex justify-center items-center gap-2" id="starContainer">
        <button onclick="rate(1)" class="star-btn text-slate-300 text-3xl hover:text-amber-400 transition" data-star="1"><i class="fa-solid fa-star"></i></button>
        <button onclick="rate(2)" class="star-btn text-slate-300 text-3xl hover:text-amber-400 transition" data-star="2"><i class="fa-solid fa-star"></i></button>
        <button onclick="rate(3)" class="star-btn text-slate-300 text-3xl hover:text-amber-400 transition" data-star="3"><i class="fa-solid fa-star"></i></button>
        <button onclick="rate(4)" class="star-btn text-slate-300 text-3xl hover:text-amber-400 transition" data-star="4"><i class="fa-solid fa-star"></i></button>
        <button onclick="rate(5)" class="star-btn text-slate-300 text-3xl hover:text-amber-400 transition" data-star="5"><i class="fa-solid fa-star"></i></button>
      </div>
      <p id="starHint" class="text-xs font-semibold text-slate-400 mt-3">Pilih jumlah bintang</p>
    </div>

    <!-- Tombol Kirim -->
    <button id="submitBtn" onclick="redirectUser()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3.5 rounded-xl transition cursor-not-allowed">
      Kirim Ulasan
    </button>

    <div class="text-[11px] text-slate-400 pt-2 border-t border-slate-100">
      <i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i> Sampaikan masukan Anda secara langsung kepada manajemen kami.
    </div>

  </div>

  <footer class="text-center text-xs text-slate-400 py-3">
    Powered by Smart Review System
  </footer>

  <script>
    // 1. Baca Parameter URL Dinamis
    const urlParams = new URLSearchParams(window.location.search);
    
    const namaToko = urlParams.get('toko') || "Toko Kami";
    const waNumber = urlParams.get('wa') || "6281234567890";
    const reviewUrl = urlParams.get('review') || "https://maps.google.com";

    document.getElementById('shopNameDisplay').innerText = `Bagaimana Pengalaman Anda di ${namaToko}?`;

    let selectedRating = 0;

    function rate(stars) {
      selectedRating = stars;
      const allStars = document.querySelectorAll('.star-btn');
      const hint = document.getElementById('starHint');
      const btn = document.getElementById('submitBtn');

      allStars.forEach((s, idx) => {
        if (idx < stars) {
          s.classList.remove('text-slate-300');
          s.classList.add('text-amber-400');
        } else {
          s.classList.remove('text-amber-400');
          s.classList.add('text-slate-300');
        }
      });

      if (stars >= 4) {
        hint.innerText = `Bintang ${stars} - Sangat Bagus! (Ke Google Review)`;
        hint.className = "text-xs font-semibold text-emerald-600 mt-3";
      } else {
        hint.innerText = `Bintang ${stars} - Butuh Perbaikan (Ke WA Management)`;
        hint.className = "text-xs font-semibold text-amber-600 mt-3";
      }

      btn.disabled = false;
      btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30 cursor-pointer";
    }

    function redirectUser() {
      if (selectedRating === 0) return;

      if (selectedRating >= 4) {
        window.location.href = decodeURIComponent(reviewUrl);
      } else {
        const message = encodeURIComponent(`Halo Manajemen ${namaToko}, saya ingin memberikan masukan/komplain mengenai pelayanan (Rating ${selectedRating} Bintang).`);
        window.location.href = `https://wa.me/${waNumber}?text=${message}`;
      }
    }
  </script>
</body>
</html>
